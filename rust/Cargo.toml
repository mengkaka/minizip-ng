[package]
name = "minizip-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
byteorder = "1.5"
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
crc32fast = "1.3"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
chrono = "0.4"
bitflags = "2.4"
thiserror = "1.0"
rand = "0.8"
